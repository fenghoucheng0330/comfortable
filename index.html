<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链接生成器</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:600px;margin:40px auto;padding:0 20px;}
.box{margin:16px 0}
label{display:block;margin-bottom:6px;font-weight:500}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{padding:12px 24px;background:#4080ff;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:10px}
.result{margin-top:20px;padding:16px;background:#f4f7ff;border-radius:8px;word-break:break-all}
a{color:#2563eb}
</style>
</head>
<body>
<h2>🔗 自定义页面链接生成器</h2>
<div class="box">
<label>基础前缀（你的网站根，默认不要改）</label>
<input id="base" value="https://fenghoucheng0330.github.io/comfortable">
</div>
<div class="box">
<label>路径后缀（斜杠后面，英文代号，比如 halcyon）</label>
<input id="path" placeholder="输入路径，例如：halcyon">
</div>
<div class="box">
<label>页面展示文字</label>
<textarea id="text" rows="3" placeholder="输入页面显示的内容，例如：I love you"></textarea>
</div>
<button onclick="createLink()">生成链接 & 页面代码</button>
<div class="result" id="res"></div>

<script>
function createLink(){
  const base = document.getElementById('base').value.trim();
  const path = document.getElementById('path').value.trim();
  const showText = document.getElementById('text').value;
  if(!path || !showText){
    document.getElementById('res').innerText = "⚠️ 路径和展示文字都要填！";
    return;
  }
  const finalUrl = `${base}/${path}`;
  const pageCode = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
</head>
<body style="display:flex;justify-content:center;align-items:center;height:90vh;margin:0;font-size:42px;">
${showText}
</body>
</html>`;
  document.getElementById('res').innerHTML = `
✅ 你的访问链接：<a href="${finalUrl}" target="_blank">${finalUrl}</a>
<br><br>
📄 复制下面这段代码，新建文件夹【${path}】，文件夹里面新建 index.html，粘贴进去上传：
<pre style="background:#fff;padding:10px;overflow-x:auto;">${pageCode}</pre>
`
}
</script>
</body>
</html>
