<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍃</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  background: url("https://images.unsplash.com/photo-1448375240586-882707db888b?w=1200") center/cover fixed;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.text{
  font-size:32px;
  color:#ffffff;
  text-shadow:0 2px 10px #00000070;
  text-align:center;
  line-height:1.6;
}
</style>
</head>
<body>
<div class="text" id="showText"></div>
<script>
const params = new URLSearchParams(location.search);
const content = params.get('text') || "愿你自在如风";
document.getElementById('showText').innerText = decodeURIComponent(content);
</script>
</body>
</html>
